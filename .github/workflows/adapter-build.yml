name: Build matching Onuce manager adapters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onuce-automatic-manager-adapters
  cancel-in-progress: false
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ONUCE_KERNEL_IMAGE: ghcr.io/ylarod/ddk-min:android17-6.18-20260828
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cvhhji/Onuce
          ref: codex/onuce-manager-build-20261029
          ssh-key: ${{ secrets.ONUCE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare APK signature verifier
        run: sdkmanager 'build-tools;37.0.0'
      - name: Inspect official upstream managers
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/proposal out/kernels
          python3 ci/upstream_managers.py --output out/proposal --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          python3 - <<'PY'
          import json, os
          report = json.load(open('out/proposal/upstream-report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(any(item['status'] == 'update' for item in report)).lower() + '\n')
          PY
      - name: Inspect private KowSU production source tags
        id: private
        env:
          GH_TOKEN: ${{ github.token }}
          ONUCE_KOWSU_DEPLOY_KEY: ${{ secrets.ONUCE_KOWSU_DEPLOY_KEY }}
        run: |
          python3 ci/private_manager.py --output out/private
          python3 - <<'PY'
          import json, os
          report = json.load(open('out/private/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(report['status'] == 'update').lower() + '\n')
          PY
      - name: Stage credential-free build inputs for changed public managers only
        if: steps.upstream.outputs.changed == 'true' || steps.private.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          target = pathlib.Path('out/build-input')
          (target / 'kernel').mkdir(parents=True)
          (target / 'native').mkdir()
          for name in ('build.sh', 'build_backends.py', 'allowlist_load.h'):
              shutil.copyfile(pathlib.Path('kernel') / name, target / 'kernel' / name)
          shutil.copytree('kernel/checks', target / 'kernel/checks')
          shutil.copyfile('native/su_mode.h', target / 'native/su_mode.h')
          changed = {item['key'] for item in json.load(open('out/proposal/upstream-report.json')) if item['status'] == 'update'}
          entries = [item for item in json.load(open('out/proposal/candidate-kernels.json')) if item['key'] in changed]
          if any('archive' in item for item in entries):
              raise ValueError('Private archived source requires manual adaptation')
          if json.load(open('out/private/report.json'))['status'] == 'update':
              entries.append(json.load(open('out/private/kernel.json')))
              (target / 'kernel/vendor').mkdir()
              shutil.copyfile('out/private/kowsu.tar.gz', target / 'kernel/vendor/kowsu.tar.gz')
          (target / 'kernel/backends.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
      - name: Free kernel toolchain space
        if: steps.upstream.outputs.changed == 'true' || steps.private.outputs.changed == 'true'
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Fingerprint toolchain
        if: steps.upstream.outputs.changed == 'true' || steps.private.outputs.changed == 'true'
        id: toolchain
        run: echo "hash=$(docker run --rm "$ONUCE_KERNEL_IMAGE" clang --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: steps.upstream.outputs.changed == 'true' || steps.private.outputs.changed == 'true'
        with:
          path: |
            /tmp/onuce-gki
            /tmp/onuce-kdir
          key: onuce-gki-f957accaf563-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('kernel/build.sh', 'kernel/checks/**') }}
      - name: Compile matching device modules in a credential-free container
        if: steps.upstream.outputs.changed == 'true' || steps.private.outputs.changed == 'true'
        env:
          PUBLIC_CHANGED: ${{ steps.upstream.outputs.changed }}
        run: |
          mkdir -p /tmp/onuce-gki /tmp/onuce-kdir out/kernels
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/tmp/onuce-gki \
            -v "$GITHUB_WORKSPACE/out/build-input:/onuce-input:ro" -v "$GITHUB_WORKSPACE/out/kernels:/onuce-out" \
            -v /tmp/onuce-gki:/tmp/onuce-gki -v /tmp/onuce-kdir:/tmp/onuce-kdir \
            -w /onuce-input "$ONUCE_KERNEL_IMAGE" bash kernel/build.sh /onuce-input /onuce-out
          if [ "$PUBLIC_CHANGED" = true ]; then
            python3 ci/accept_manager_update.py --proposal out/proposal --built out/kernels
          fi
      - name: Validate modules and build the feed
        run: |
          python3 ci/verify.py
          python3 -m unittest discover -s ci/tests -v
          python3 ci/distribution.py --modules payload out/kernels --output out/distribution
      - name: Save verified payloads to the independent source branch only
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ONUCE_SOURCE_DEPLOY_KEY: ${{ secrets.ONUCE_SOURCE_DEPLOY_KEY }}
        run: python3 ci/push_adapter_branch.py
      - name: Publish immutable modules and switch the catalog pointer last
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish_adapters.py --directory out/distribution
      - name: Record source
        if: always()
        run: |
          mkdir -p out
          git rev-parse HEAD > out/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Onuce-Automatic-adapters-${{ github.run_id }}
          path: |
            out/proposal/upstream-report.json
            out/private/report.json
            out/source-commit.txt
            out/distribution/
            out/kernels/*-build.log
          if-no-files-found: error
          retention-days: 30
