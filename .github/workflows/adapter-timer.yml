name: Watch upstream managers; build adapters every 4 hours
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      run_adapter_now:
        description: '立即触发管理器模块检查和更新'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: onuce-adapter-timer
  cancel-in-progress: false
jobs:
  dispatch:
    if: ${{ github.event_name == 'schedule' || inputs.run_adapter_now }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the four-hour automatic-build interval
        id: cadence
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone

          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/adapter-build.yml/runs?per_page=100"
          payload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          runs = payload.get('workflow_runs', [])
          active = any(run.get('status') in ('queued', 'in_progress') for run in runs)
          automated = [run for run in runs if run.get('event') == 'workflow_dispatch' and run.get('actor', {}).get('login') == 'github-actions[bot]']
          latest = max(automated, key=lambda run: run.get('run_started_at') or run['created_at'], default=None)
          now = datetime.now(timezone.utc)
          if active:
              due = False
              reason = 'an adapter build is already queued or running'
          elif latest is None:
              due = True
              reason = 'no previous automated build found'
          else:
              stamp = latest.get('run_started_at') or latest['created_at']
              started = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              elapsed = now - started
              due = elapsed >= timedelta(hours=4)
              reason = f'{elapsed.total_seconds() / 3600:.2f} hours since the last automated build'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"due={'true' if due else 'false'}\\n")
          print(f'Automatic dispatch due: {due}; {reason}')
          PY
      - name: Trigger the adapter builder that reads the independent source branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_adapter_now || github.event_name == 'schedule' && steps.cadence.outputs.due == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run adapter-build.yml --repo cvhhji/Onuce-updates --ref main
