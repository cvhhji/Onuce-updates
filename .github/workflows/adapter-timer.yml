name: Check upstream managers every 4 hours
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      run_adapter_now:
        description: '立即触发管理器模块检查和更新'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: onuce-adapter-timer
  cancel-in-progress: false
jobs:
  dispatch:
    if: ${{ github.event_name == 'schedule' || inputs.run_adapter_now }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the adapter builder that reads the independent source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run adapter-build.yml --repo cvhhji/Onuce-updates --ref main
